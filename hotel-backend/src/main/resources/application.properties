spring.application.name=hotel-backend

# Povezivanje na bazu: ako postoje varijable na cloudu koristi njih, inače koristi lokalni Docker
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotel_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate postavke
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Port: koristi PORT varijablu ako je cloud postavi (Render/Railway), inače 8080
server.port=${PORT:8080}